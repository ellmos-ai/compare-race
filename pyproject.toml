[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compare-race"
version = "0.7.2"
description = "Same prompt, several models -- stopwatch or true race; the starting model judges (time is only one dimension)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Lukas Geiger" }]
keywords = [
    "ai-benchmarking",
    "benchmark",
    "cli",
    "ellmos-ai",
    "evaluation",
    "kantian-reason",
    "llm",
    "local-first",
    "model-comparison",
    "model-evaluation",
    "multi-agent",
    "olympiad",
    "open-bricks",
    "prompt-engineering",
    "python",
    "race",
    "starter-judge",
    "stopwatch",
    "twin-mode",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "system-auditor @ git+https://github.com/ellmos-ai/system-auditor",
]

[project.optional-dependencies]
exec = []  # COMA is detected, not assumed: install it editable from ellmos-ai/coma
test = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/compare-race"
Repository = "https://github.com/ellmos-ai/compare-race"
Issues = "https://github.com/ellmos-ai/compare-race/issues"
Changelog = "https://github.com/ellmos-ai/compare-race/blob/master/CHANGELOG.md"
Contributing = "https://github.com/ellmos-ai/compare-race/blob/master/CONTRIBUTING.md"
Documentation = "https://github.com/ellmos-ai/compare-race#readme"
Security = "https://github.com/ellmos-ai/compare-race/blob/master/SECURITY.md"
Notice = "https://github.com/ellmos-ai/compare-race/blob/master/NOTICE"
"Third-Party Licenses" = "https://github.com/ellmos-ai/compare-race/blob/master/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/compare-race/blob/master/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/compare-race/blob/master/LICENSE"
"Marketing Log" = "https://github.com/ellmos-ai/compare-race/blob/master/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Context" = "https://github.com/ellmos-ai/compare-race/blob/master/llms.txt"

[project.scripts]
compare-race = "compare_race.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -v"
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", ".venv", ".pytest_temp", ".pytest_tmp*", ".tox", ".hypothesis", ".turbo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
